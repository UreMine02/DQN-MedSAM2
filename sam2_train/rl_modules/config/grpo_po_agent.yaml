agent:
  _target_: sam2_train.rl_modules.policy_optimization.grpo_agent.GRPOAgent
  num_maskmem: 6
  policy_lr: 1e-4
  # Unused by GRPO -- the group mean is the baseline, so there is no critic and no
  # bootstrapping. Kept only because BasePOAgent's signature takes them.
  value_lr: 1e-4
  gamma: 0.99
  tau: 0.9
  buffer_size: 4096
  batch_size: 32
  entropy_weight: 0.01
  epsilon: 0.2
  target_kl: 0.05
  lr_T_max: 500
  min_lr: 2e-5
  n_layers: 2
  advantage_norm: group_std
  adv_min_scale: 1e-8
  range: 1.0
  sam2_dim:
    n_query: 16
    image_dim: 256
    memory_dim: 64
    obj_ptr_dim: 256
    image_summary_dim: 128
